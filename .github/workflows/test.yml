name: Isolated validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: knowledge
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen --extra test
      - run: uv run --frozen python scripts/bootstrap.py && uv run --frozen pytest -q --junitxml=evidence/ci-tests.xml
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:testing-only@localhost:5432/knowledge
          INGEST_DATABASE_URL: postgresql://gateway_ingest:ingest-test-only@localhost:5432/knowledge
          RETRIEVAL_DATABASE_URL: postgresql://gateway_reader:reader-test-only@localhost:5432/knowledge
          READER_DATABASE_PASSWORD: reader-test-only
          INGEST_DATABASE_PASSWORD: ingest-test-only
          EMBEDDING_REVISION: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-evidence
          path: evidence/ci-tests.xml
