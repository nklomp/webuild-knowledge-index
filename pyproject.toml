[project]
name = "webuild-knowledge-index"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "psycopg[binary]==3.3.6", "pgvector==0.5.0", "mcp==2.3.0", "sentence-transformers==6.1.0", "torch==2.14.1+cpu", "httpx[socks]==0.28.1", "pyyaml==6.0.3", "markdown-it-py==4.2.0", "pypdf==6.20.1", "rdflib==7.6.0", "beautifulsoup4==4.15.0", "cryptography==50.0.2"]
[project.optional-dependencies]
test = ["pytest==9.1.1"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.setuptools.packages.find]
include = ["gateway*"]
[tool.setuptools.package-data]
gateway = ["site_assets/*"]
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"
