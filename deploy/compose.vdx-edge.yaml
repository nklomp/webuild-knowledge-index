# Local Docker Desktop deployment behind the existing vdx-edge Traefik.
# Use together with compose.yaml and start db/retrieval/wiki (not edge).
services:
  retrieval:
    ports: !reset []
    mem_limit: 2g
    cpus: 2
    networks:
      default: {}
      edge:
        aliases: [webuild-knowledge-retrieval]
  wiki:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    cpus: 0.25
    tmpfs:
      - /tmp:uid=101,gid=101
    volumes:
      - generated-site:/srv:ro
      - ./nginx-webuild.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      edge:
        aliases: [webuild-knowledge-wiki]
  ingest:
    mem_limit: 4g
    cpus: 4
    environment:
      EMBEDDING_CPU_THREADS: '4'
networks:
  default:
    ipam:
      config:
        - subnet: 10.252.205.0/24
  edge:
    external: true
    name: edge
