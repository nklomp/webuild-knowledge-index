server {
    listen 8080;
    server_name webuild.nk.sphereon.com;
    root /srv/current;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    # A missing publication is an explicit unavailable state, never an empty wiki.
    if (!-f /srv/current/index.html) { return 503; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
